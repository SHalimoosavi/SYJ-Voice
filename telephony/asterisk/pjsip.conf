; Development WebRTC transport/template only. Configure TLS, ACLs and endpoints before exposure.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
[webrtc-template](!)
type=endpoint
transport=transport-wss
context=syj-internal
disallow=all
allow=opus,ulaw
webrtc=yes
dtls_auto_generate_cert=yes
media_encryption=dtls
rtcp_mux=yes
use_avpf=yes
ice_support=yes
direct_media=no
